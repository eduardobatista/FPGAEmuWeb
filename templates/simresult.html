{% extends "base.html" %}

{% block styles %}
    <link rel="stylesheet" href="static/css/jquery-ui.structure.min.css">  
    <link rel="stylesheet" href="static/css/jquery-ui.theme.min.css">   

    <style>
        html, body { overflow: hidden; }

        /* Hide the nested list */
        .nesteditem {
            display: none;
        }

        /* Show the nested list when the user clicks on the caret/arrow (with JavaScript) */
        .activeitem {
            display: block;
        }

    </style>
{% endblock %} 

{% block content %}

    <div class="fe-app" style="padding: 16px 20px 20px;">
        <div style="flex: 1; min-height: 0; border: 1px solid #d6dbd8; border-radius: 10px; overflow: hidden; background: var(--fe-surface);">
            <iframe id="surferiframe" src="/static/surfer_wasm/index.html" title="Surfer waveform viewer"
                    style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
        </div>
    </div>

{% endblock %}

{% block scripts %}

            document.querySelector('#surferiframe').contentWindow.postMessage({command: "LoadUrl", url: "/downloadsimfile"}, "*");
            document.querySelector('#surferiframe').contentWindow.postMessage({command: "ToggleMenu"}, "*");        
        });

    <script>
        window.addEventListener("message", (event) => {
            if (event.data.command === "SurferReady") {
                console.log("Surfer is ready, sending LoadUrl command with {{filetoload}}");
                document.querySelector('#surferiframe').contentWindow.postMessage({command: "LoadUrl", url: window.location.origin + "/output.ghw"}, "*");
                document.querySelector('#surferiframe').contentWindow.postMessage({command: "ToggleMenu"}, "*");        
            }
        });
    </script>
   
    


{% endblock %}
