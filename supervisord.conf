[supervisord]
nodaemon=true

# Everything that handles users' requests runs as fpgaweb; the code they send, as fpgarun. Only
# supervisord, workmigrate and (until the migration ends) worksync are root. See deploy/README.md.
[program:app]
user=fpgaweb
umask=077
environment=HOME="/home/fpgaweb"
directory=/home/fpgaemuweb
# command=python3 start.py debug
# command=/usr/local/bin/gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -b :5000 -w 1 --chdir /home/fpgaemuweb start:app
# worksync.py wait-ready serves a "starting" page until the data copy from NFS is done, then execs gunicorn.
command=/usr/bin/python3 /home/fpgaemuweb/worksync.py wait-ready -- /home/fpgaemuweb/.venv/bin/gunicorn -k gunicorn_worker.Worker -b :5000 -w 1 --chdir /home/fpgaemuweb start:app
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/home/stdout.log
stdout_maxbytes=20KB
stderr_logfile=/home/stderr.log
stderr_maxbytes=20KB

# [program:nginx]
# command=/usr/sbin/nginx -g "daemon off;"
# autostart=true
# autorestart=true
# startretries=5
# numprocs=1
# startsecs=2

# Runs the code sent by users. env -i: secrets in the container's environment do not get here.
[program:sandboxd]
user=fpgarun
directory=/
command=/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 /home/fpgaemuweb/backend/sandboxd.py
priority=100
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true

# Gives work/ (NFS) to fpgaweb, in the background and without e-mail names. See migrate_work.py.
[program:workmigrate]
user=root
directory=/home/fpgaemuweb
command=/usr/bin/nice -n 10 /usr/bin/python3 /home/fpgaemuweb/migrate_work.py daemon
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0

[program:huey]
user=fpgaweb
umask=077
environment=HOME="/home/fpgaweb",PYTHONPATH="/home/fpgaemuweb"
directory=/home/fpgaemuweb
command=/home/fpgaemuweb/.venv/bin/huey_consumer worker.huey -w 5
autostart=true
autorestart=true
startsecs=15
startretries=10
# stdout_logfile=/home/stdout.log
# stdout_maxbytes=20KB
# stderr_logfile=/home/stderr.log
# stderr_maxbytes=20KB



# Serves the diagnostics report on port 5000 if the web app stops answering for 5 minutes.
[program:diagfallback]
user=fpgaweb
environment=HOME="/home/fpgaweb"
directory=/home/fpgaemuweb
command=/usr/bin/python3 /home/fpgaemuweb/diagnostics/diagnose.py serve-fallback
autostart=true
autorestart=true
startsecs=5

# Keeps cachedwork/ (local disk, used by the app) and work/ (NFS) in sync. See worksync.py.
# Starts as root and drops it by itself once work/ is migrated (select_identity).
[program:worksync]
user=root
directory=/home/fpgaemuweb
command=/usr/bin/python3 /home/fpgaemuweb/worksync.py daemon
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=60
